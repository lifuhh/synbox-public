# Deploy previews build only on request (a [preview] commit), to save build minutes: AGENTS.md › Shipping
[build]
ignore = "bash scripts/netlify-ignore.sh"

# A stale service worker would pin every visitor to an old deploy
[[headers]]
for = "/sw.js"
[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/manifest.webmanifest"
[headers.values]
Content-Type = "application/manifest+json"
Cache-Control = "no-cache"

# Vite's bundles have content hashes in their names; public/assets/ (icons) does not, so only these
[[headers]]
for = "/assets/*.js"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/assets/*.css"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Sign-in, account and admin routes live in the auth Worker (worker/). Proxying them keeps its session cookie
# first-party on synbox.io
[[redirects]]
from = "/api/auth/*"
to = "https://api.synbox.io/api/auth/:splat"
status = 200
force = true

[[redirects]]
from = "/api/me"
to = "https://api.synbox.io/api/me"
status = 200
force = true

[[redirects]]
from = "/api/me/*"
to = "https://api.synbox.io/api/me/:splat"
status = 200
force = true

[[redirects]]
from = "/api/admin/*"
to = "https://api.synbox.io/api/admin/:splat"
status = 200
force = true

# The home gallery's song list, from the backend's lookup service. Netlify keeps the copy that service allows
# (its Netlify-CDN-Cache-Control header), so most visits never reach it
[[redirects]]
from = "/api/library/songs"
to = "https://synbox-lookup-1045990822048.asia-southeast1.run.app/library/songs"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[build.environment]
NODE_VERSION = "24"
# The backend's lookup service (search, karaoke timing, lyrics versions); public, so it lives here
VITE_SYNBOX_LOOKUP_URL = "https://synbox-lookup-1045990822048.asia-southeast1.run.app"
