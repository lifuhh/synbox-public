# Deploy previews build only on request (a [preview] commit), to save build minutes: AGENTS.md › Shipping
[build]
ignore = "bash scripts/netlify-ignore.sh"

# Every page and file. The policy lists what the app loads, and nothing else: its own files and /api; the YouTube
# player (iframe and its API script) and thumbnails; Google Fonts; Google account pictures; Appwrite; the backend's
# lookup service on Cloud Run; the auth Worker at api.synbox.io, which passes song generation on
# (worker/src/generation.ts); Sentry (Replay's script from its CDN, events to its ingest host).
# Fetched rather than shown, so in connect-src: YouTube's oEmbed (the player's video shape,
# src/components/player-stage/video-fit.ts) and thumbnails saved for offline (src/lib/offline/sync.ts). The
# service worker gets the same policy, and fetches fonts and account pictures itself (vite.config.ts ›
# runtimeCaching), so those are in connect-src too. No eval: Zod runs jitless (vite.config.ts › ZOD_JITLESS). Styles allow
# inline, for the <style> tags Radix's scroll lock adds. Nothing may frame the app. HSTS covers subdomains: the
# zone's only names are synbox.io, www and api, all HTTPS (checked 2026-10-24)
[[headers]]
for = "/*"
[headers.values]
Content-Security-Policy = """\
  default-src 'self'; \
  script-src 'self' https://www.youtube.com https://browser.sentry-cdn.com; \
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
  font-src 'self' https://fonts.gstatic.com; \
  img-src 'self' data: blob: https://*.ytimg.com https://*.googleusercontent.com https://*.ggpht.com; \
  connect-src 'self' https://cloud.appwrite.io https://synbox-lookup-1045990822048.asia-southeast1.run.app \
    https://api.synbox.io https://*.ingest.us.sentry.io \
    https://www.youtube.com https://i.ytimg.com \
    https://fonts.googleapis.com https://fonts.gstatic.com https://lh3.googleusercontent.com; \
  frame-src https://www.youtube.com https://www.youtube-nocookie.com; \
  worker-src 'self' blob:; \
  manifest-src 'self'; \
  object-src 'none'; \
  base-uri 'self'; \
  form-action 'self'; \
  frame-ancestors 'none'\
  """
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# A stale service worker would pin every visitor to an old deploy
[[headers]]
for = "/sw.js"
[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/manifest.webmanifest"
[headers.values]
Content-Type = "application/manifest+json"
Cache-Control = "no-cache"

# The logo's name carries its content hash (svgicons › SynboxLogo)
[[headers]]
for = "/synbox-logo-*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Vite's bundles have content hashes in their names; public/assets/ (icons) does not, so only these
[[headers]]
for = "/assets/*.js"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/assets/*.css"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Sign-in, account and admin routes live in the auth Worker (worker/). Proxying them keeps its session cookie
# first-party on synbox.io
[[redirects]]
from = "/api/auth/*"
to = "https://api.synbox.io/api/auth/:splat"
status = 200
force = true

[[redirects]]
from = "/api/me"
to = "https://api.synbox.io/api/me"
status = 200
force = true

[[redirects]]
from = "/api/me/*"
to = "https://api.synbox.io/api/me/:splat"
status = 200
force = true

[[redirects]]
from = "/api/admin/*"
to = "https://api.synbox.io/api/admin/:splat"
status = 200
force = true

# The landing page's Recommendations, which admins edit on the admin page
[[redirects]]
from = "/api/recommendations"
to = "https://api.synbox.io/api/recommendations"
status = 200
force = true

# Listeners' reports of songs with wrong lyrics, kept by the auth Worker
[[redirects]]
from = "/api/reports"
to = "https://api.synbox.io/api/reports"
status = 200
force = true

# Each song's listens and likes, kept by the auth Worker
[[redirects]]
from = "/api/songs/*"
to = "https://api.synbox.io/api/songs/:splat"
status = 200
force = true

# The app's usage events (src/lib/usage.ts) and the Contact Us form (src/lib/contact.ts), kept by the auth Worker
[[redirects]]
from = "/api/events"
to = "https://api.synbox.io/api/events"
status = 200
force = true

[[redirects]]
from = "/api/contact"
to = "https://api.synbox.io/api/contact"
status = 200
force = true

# A script or style from an earlier deploy is gone: say so, instead of index.html under the bundles' one-year
# immutable header, which a browser would keep as that script
[[redirects]]
from = "/assets/*"
to = "/404.html"
status = 404

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[build.environment]
NODE_VERSION = "24"
# The backend's lookup service (search, karaoke timing, lyrics versions); public, so it lives here
VITE_SYNBOX_LOOKUP_URL = "https://synbox-lookup-1045990822048.asia-southeast1.run.app"
# Song generation goes through the auth Worker, the only caller the generating service admits
# (worker/src/generation.ts). Straight to api.synbox.io, not through synbox.io/api: Netlify's proxy cuts a request
# off after 26 s, and a generation stream runs for minutes
VITE_SYNBOX_BE_URL = "https://api.synbox.io/api/generation"
# Lyrics and karaoke timing come from the auth Worker, one song at a time (worker/src/lyrics.ts, src/lib/lyrics-api.ts).
# Straight to api.synbox.io, so the Worker counts each visitor's own network
VITE_SYNBOX_API_URL = "https://api.synbox.io"
