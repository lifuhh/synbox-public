<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark" />
    <!-- The top edge of a page: the glow over the page colour (Android paints the status bar with it) -->
    <meta name="theme-color" content="#0e0c0c" />
    <meta
      name="description"
      content="Japanese karaoke for any YouTube video, with AI-transcribed, synced lyrics, furigana, romaji and translations." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Synbox" />
    <!-- The app draws under the status bar and pads itself by the safe-area insets -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32-29d45201.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16-394acbc3.png" />
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon-180x180-b75d2442.png" />
    <!-- What the installed iPhone app shows while it starts, instead of a blank screen: iOS uses the one whose
         query names its screen exactly -->
    <!-- launch-images:start (written by scripts/pwa-icons.ts: edit SCREENS there) -->
    <!-- iPhone 17 Pro Max, 16 Pro Max -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/launch/launch-1320x2868-189d8b9d.png" />
    <!-- iPhone 16 Plus, 15 Pro Max, 15 Plus, 14 Pro Max -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/launch/launch-1290x2796-64f8bb37.png" />
    <!-- iPhone 14 Plus, 13 Pro Max, 12 Pro Max -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/launch/launch-1284x2778-ae1ef0fd.png" />
    <!-- iPhone Air -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/launch/launch-1260x2736-65f8afab.png" />
    <!-- iPhone 11 Pro Max -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/launch/launch-1242x2688-e1f50da9.png" />
    <!-- iPhone 11 -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/launch/launch-828x1792-6a22fff0.png" />
    <!-- iPhone 17 Pro, 17, 16 Pro -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/launch/launch-1206x2622-115ec236.png" />
    <!-- iPhone 16, 15 Pro, 15, 14 Pro -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/launch/launch-1179x2556-1edcc7e7.png" />
    <!-- iPhone 16e, 14, 13 Pro, 13, 12 Pro, 12 -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/launch/launch-1170x2532-3fda143a.png" />
    <!-- iPhone 13 mini, 12 mini, 11 Pro -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/launch/launch-1125x2436-86475ced.png" />
    <!-- iPhone SE 2, SE 3 -->
    <link
      rel="apple-touch-startup-image"
      media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/launch/launch-750x1334-4d45a47c.png" />
    <!-- launch-images:end -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Lyrics and karaoke timing come from the Worker (src/lib/lyrics-api.ts), without cookies: a warm connection takes
         the TLS setup off the first song's lyrics -->
    <link rel="preconnect" href="https://api.synbox.io" crossorigin />
    <!-- Noto Sans draws the latin lyric lines, and Noto Sans SC the Chinese translations at the lyrics' weight (the
         Japanese font lacks simplified characters, which fell back to a lighter system font); phones ship neither, so
         they load like the rest, a unicode-range slice at a time -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&family=Noto+Sans:wght@900&family=Noto+Sans+JP:wght@100..900&family=Noto+Sans+SC:wght@400..900&display=swap"
      rel="stylesheet" />
    <!-- The home page's. netlify/edge-functions/page-head.ts rewrites these for every other page -->
    <link rel="canonical" href="https://synbox.io/" />
    <meta property="og:site_name" content="Synbox" />
    <meta property="og:title" content="Synbox" />
    <meta
      property="og:description"
      content="Japanese karaoke for any YouTube video, with AI-transcribed, synced lyrics, furigana, romaji and translations." />
    <meta property="og:url" content="https://synbox.io/" />
    <meta property="og:type" content="website" />
    <title>Synbox · Japanese Karaoke for Any YouTube Video</title>
    <!-- The site's name in Google's results (not "synbox.io"). Data, not a script: the CSP doesn't apply -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Synbox",
        "alternateName": ["Synbox Karaoke", "synbox.io"],
        "url": "https://synbox.io/"
      }
    </script>
    <!-- The page's colour from the first paint, before the stylesheet arrives (globals.css › --graphite-1), so a slow
         first load is the app's dark page, never a white one -->
    <style>
      html {
        background: oklch(0.155 0.004 350);
      }
      /* What Synbox is, for a reader that runs no script (Google's app verification, crawlers): in the HTML from the
         first byte, but shown only after 2.5s, by when React has long replaced it, so a visitor never sees it flash.
         CSS, not a script: the CSP allows no inline script */
      @keyframes static-home-reveal {
        from {
          visibility: hidden;
        }
        to {
          visibility: visible;
        }
      }
      #static-home {
        visibility: hidden;
        animation: static-home-reveal 0s 2.5s forwards;
        max-width: 36rem;
        margin: 0 auto;
        padding: 4rem 1.5rem;
        color: #e6dfe3;
        font:
          16px/1.6 system-ui,
          sans-serif;
      }
      #static-home a {
        color: #f0a6c8;
      }
      /* A visitor sees this page only when the app didn't start (no connection, a script that failed to load), and
         the installed app has no browser reload: this is the way out. 44px tall */
      #static-home .reload {
        display: inline-block;
        padding: 0.6rem 1.25rem;
        border-radius: 999px;
        background: #f0a6c8;
        color: #1a1216;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main id="static-home">
        <h1>Synbox</h1>
        <!-- An empty href loads this same address again -->
        <p>Not loading? <a class="reload" href="">Reload</a></p>
        <p>
          Japanese karaoke for any YouTube video. Paste a link, and Synbox
          transcribes the song, times its lyrics word by word, and shows them
          with furigana, romaji and English or Chinese translations while it
          plays.
        </p>
        <nav aria-label="Links">
          <a href="/about">About</a> · <a href="/privacy">Privacy Policy</a> ·
          <a href="/terms">Terms of Use</a>
        </nav>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
