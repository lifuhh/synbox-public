<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark" />
    <!-- The top edge of a page: the glow over the page colour (Android paints the status bar with it) -->
    <meta name="theme-color" content="#3c1628" />
    <meta
      name="description"
      content="Japanese karaoke for any YouTube video, with AI-transcribed, synced lyrics, furigana, romaji and translations." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Synbox" />
    <!-- The app draws under the status bar and pads itself by the safe-area insets -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32-29d45201.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16-394acbc3.png" />
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon-180x180-b75d2442.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Lyrics and karaoke timing come from the Worker (src/lib/lyrics-api.ts), without cookies: a warm connection takes
         the TLS setup off the first song's lyrics -->
    <link rel="preconnect" href="https://api.synbox.io" crossorigin />
    <!-- Noto Sans draws the latin lyric lines, and Noto Sans SC the Chinese translations at the lyrics' weight (the
         Japanese font lacks simplified characters, which fell back to a lighter system font); phones ship neither, so
         they load like the rest, a unicode-range slice at a time -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&family=Noto+Sans:wght@900&family=Noto+Sans+JP:wght@100..900&family=Noto+Sans+SC:wght@400..900&display=swap"
      rel="stylesheet" />
    <!-- The home page's. netlify/edge-functions/page-head.ts rewrites these for every other page -->
    <link rel="canonical" href="https://synbox.io/" />
    <meta property="og:site_name" content="Synbox" />
    <meta property="og:title" content="Synbox" />
    <meta
      property="og:description"
      content="Japanese karaoke for any YouTube video, with AI-transcribed, synced lyrics, furigana, romaji and translations." />
    <meta property="og:url" content="https://synbox.io/" />
    <meta property="og:type" content="website" />
    <title>Synbox · Japanese Karaoke for Any YouTube Video</title>
    <!-- The site's name in Google's results (not "synbox.io"). Data, not a script: the CSP doesn't apply -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Synbox",
        "alternateName": ["Synbox Karaoke", "synbox.io"],
        "url": "https://synbox.io/"
      }
    </script>
    <!-- The page's colour from the first paint, before the stylesheet arrives (globals.css › --graphite-1), so a slow
         first load is the app's dark page, never a white one -->
    <style>
      html {
        background: oklch(0.155 0.012 350);
      }
      /* What Synbox is, for a reader that runs no script (Google's app verification, crawlers): in the HTML from the
         first byte, but shown only after 2.5s, by when React has long replaced it, so a visitor never sees it flash.
         CSS, not a script: the CSP allows no inline script */
      @keyframes static-home-reveal {
        from {
          visibility: hidden;
        }
        to {
          visibility: visible;
        }
      }
      #static-home {
        visibility: hidden;
        animation: static-home-reveal 0s 2.5s forwards;
        max-width: 36rem;
        margin: 0 auto;
        padding: 4rem 1.5rem;
        color: #e6dfe3;
        font:
          16px/1.6 system-ui,
          sans-serif;
      }
      #static-home a {
        color: #f0a6c8;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main id="static-home">
        <h1>Synbox</h1>
        <p>
          Japanese karaoke for any YouTube video. Paste a link, and Synbox
          transcribes the song, times its lyrics word by word, and shows them
          with furigana, romaji and English or Chinese translations while it
          plays.
        </p>
        <nav aria-label="Links">
          <a href="/about">About</a> · <a href="/privacy">Privacy Policy</a> ·
          <a href="/terms">Terms of Use</a>
        </nav>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
